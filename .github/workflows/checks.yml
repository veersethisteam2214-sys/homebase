name: Check Homebase
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run install:ci
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node scripts/check-planner.mjs
      - run: node scripts/check-routine-presets.mjs
      - run: node scripts/check-life.mjs
      - run: node scripts/check-notifications.mjs
      - run: node scripts/check-cloud.mjs
      - run: npm run build
